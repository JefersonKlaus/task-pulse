<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Phones: a top bar with the ☰ button that opens the sidebar as a drawer. Wide screens: a fixed sidebar. -->
  <header id="top-bar" hidden>
    <button id="menu-toggle" class="icon" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">☰</button>
    <strong>Task Pulse</strong>
  </header>
  <div class="layout">
    <aside id="sidebar" aria-label="Menu" hidden>
      <strong class="brand">Task Pulse</strong>
      <nav id="menu"></nav>
      <div class="sidebar-footer">
        <button id="logout" class="link">Sair</button>
      </div>
    </aside>
    <div id="backdrop" hidden></div>
    <main id="content"><p class="notice">Carregando…</p></main>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
