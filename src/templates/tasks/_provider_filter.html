{% load i18n %}{% comment %}
The company filter of a list: GET ?empresa=<id>. Changing the company sends
the form right away; the button is for browsers without JavaScript.
{% endcomment %}<form method="get" class="list-filter">
    <label for="{{ form.empresa.id_for_label }}">{{ form.empresa.label }}</label>
    {{ form.empresa }}
    <button type="submit" class="secondary">{% translate "Filtrar" %}</button>
    {{ form.empresa.errors }}
</form>
<script>
    document.getElementById("{{ form.empresa.id_for_label }}").addEventListener("change", function () {
        this.form.submit();
    });
</script>
