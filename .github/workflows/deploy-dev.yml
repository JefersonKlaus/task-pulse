# Merging `dev` into `main` (the only way anything reaches main: see branch-flow.yml) deploys to the
# development AWS account, after the same tests as CI.
name: Deploy dev

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: dev
      github_environment: development
    secrets: inherit
