# Creates a login in Cognito, no terminal needed: Actions → Create user → Run workflow.
# Anyone can also sign up on the site (Criar conta); this is for creating a login by hand. The login is
# the e-mail; the name shows in Cognito. No verification code: the workflow creates the login with the
# e-mail already confirmed and a ready, permanent password (shown once, in the run's summary) to be sent
# to the person. If the e-mail already has a login, only its name is updated (or, with
# `reset_password`, its password is changed to a new one).
name: Create user

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment in which to create the user"
        required: true
        type: choice
        options: [dev, producao] # names of the GitHub Environments
      name:
        description: "User's name (e.g. Ana Lima)"
        required: true
        type: string
      email:
        description: "E-mail used to log in (e.g. ana@example.com)"
        required: true
        type: string
      reset_password:
        description: "If the e-mail already has a login: also give it a new password"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      NAME: ${{ inputs.name }} # through variables: typed text is never pasted into the shell
      EMAIL: ${{ inputs.email }}
      RESET_PASSWORD: ${{ inputs.reset_password }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create the user (or update their name)
        run: |
          NAME="$(printf '%s' "$NAME" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          if [ -z "$NAME" ] || [ "${#NAME}" -gt 80 ]; then
            echo "::error::Invalid name: type the user's name (up to 80 characters)."
            exit 1
          fi
          # The login is the e-mail in lower case (the pool ignores case anyway).
          EMAIL="$(printf '%s' "$EMAIL" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$EMAIL" | grep -Eq '^[^@]+@[^@]+[.][^@]+$'; then
            echo "::error::Invalid e-mail."
            exit 1
          fi
          TF_ENVIRONMENT="dev"
          [ "$ENVIRONMENT" = "producao" ] && TF_ENVIRONMENT="prod"
          POOL="$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='task-pulse-${TF_ENVIRONMENT}-login'].Id | [0]" --output text)"
          if [ -z "$POOL" ] || [ "$POOL" = "None" ]; then
            echo "::error::Could not find this environment's Cognito user pool. Deploy the environment first."
            exit 1
          fi
          # Attributes as JSON (built by jq): a name with commas or quotes is passed as it is.
          NAME_ATTRIBUTE="$(jq -cn --arg v "$NAME" '[{Name: "name", Value: $v}]')"
          # A password that meets the pool's policy (10+ characters, upper, lower, number).
          # Never printed to the log (only to the summary): masking it would hide it in the summary too.
          new_password() {
            PASSWORD="Ab-$(openssl rand -hex 8)"
          }
          if aws cognito-idp admin-get-user --user-pool-id "$POOL" --username "$EMAIL" > /dev/null 2>&1; then
            aws cognito-idp admin-update-user-attributes --user-pool-id "$POOL" --username "$EMAIL" \
              --user-attributes "$NAME_ATTRIBUTE"
            echo "User $EMAIL already existed in **$ENVIRONMENT**: their name was updated." >> "$GITHUB_STEP_SUMMARY"
            if [ "$RESET_PASSWORD" = "true" ]; then
              new_password
              aws cognito-idp admin-set-user-password --user-pool-id "$POOL" --username "$EMAIL" \
                --password "$PASSWORD" --permanent
              echo "New password for $EMAIL: \`$PASSWORD\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # Created without any message (no e-mail, no code) and with the e-mail already verified, then
          # given a permanent password: the person logs in right away.
          new_password
          ATTRIBUTES="$(jq -cn --arg name "$NAME" --arg email "$EMAIL" '[
            {Name: "name", Value: $name},
            {Name: "email", Value: $email}, {Name: "email_verified", Value: "true"}]')"
          aws cognito-idp admin-create-user --user-pool-id "$POOL" --username "$EMAIL" \
            --user-attributes "$ATTRIBUTES" --message-action SUPPRESS > /dev/null
          aws cognito-idp admin-set-user-password --user-pool-id "$POOL" --username "$EMAIL" \
            --password "$PASSWORD" --permanent
          {
            echo "User $EMAIL created in **$ENVIRONMENT**. Send them the password (it is not shown again):"
            echo ""
            echo "- Login (e-mail): \`$EMAIL\`"
            echo "- Password: \`$PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"
