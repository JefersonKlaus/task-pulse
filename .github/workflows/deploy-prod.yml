# Production has no automatic trigger yet (a push to `main` deploys to dev: deploy-dev.yml). For now it
# only runs by hand: Actions → Deploy production → Run workflow, on main, typing "producao" to confirm.
# To require someone to approve each deploy, set "Required reviewers" on the `producao` Environment.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "producao" to confirm'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Check branch (and the confirmation, when run by hand)
    runs-on: ubuntu-24.04
    steps:
      - name: Only main; by hand, only with confirmation
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }} # through a variable: typed text is never pasted into the shell
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production only deploys from the main branch (ran on $REF)."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" != "producao" ]; then
            echo '::error::Wrong confirmation: type exactly "producao".'
            exit 1
          fi

  tests:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      github_environment: producao
    secrets: inherit
